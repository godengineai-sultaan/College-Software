# WSchools Fee Management System — Docker Compose
#
#   docker compose up -d        # build + run (first run auto-creates the DB)
#   docker compose logs -f app  # follow logs
#
# Data persists in the ./data, ./backups and ./uploads volumes on the host.
# ⚠ CHANGE the secrets below (SESSION_SECRET, ADMIN_PASSWORD, BACKUP_ENCRYPTION_KEY)
# before any real deployment.

services:
  app:
    build: .
    image: wschools-fee-management
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Set TRUST_PROXY=1 when running behind the nginx TLS proxy below.
      TRUST_PROXY: "0"
      SESSION_SECRET: "REPLACE_WITH_A_LONG_RANDOM_STRING_0123456789abcdef"
      DATABASE_FILE: "data/college.sqlite"
      ADMIN_NAME: "System Administrator"
      ADMIN_EMAIL: "admin@college.edu"
      ADMIN_PASSWORD: "ChangeMe@2026"
      # Optional: encrypt backups at rest (AES-256-GCM).
      BACKUP_ENCRYPTION_KEY: ""
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional TLS reverse proxy. Put your certs in ./deploy/certs and uncomment.
  # nginx:
  #   image: nginx:alpine
  #   restart: unless-stopped
  #   depends_on: [app]
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./deploy/nginx.conf.sample:/etc/nginx/conf.d/default.conf:ro
  #     - ./deploy/certs:/etc/nginx/certs:ro
